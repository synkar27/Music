<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой Музыкальный Плеер</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:28px}.muted{color:#94a3b8}.card{background:#111827dd;border:1px solid #334155;border-radius:18px;padding:18px;margin-top:18px}
button{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:#111827;font-weight:700;cursor:pointer}
button.secondary{background:#334155;color:#fff}button.danger{background:#7f1d1d;color:#fff}
.search{width:100%;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;margin-top:12px}
.drop{border:2px dashed #475569;text-align:center;padding:28px;color:#94a3b8}
.track{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #273449;cursor:pointer}
.track:last-child{border-bottom:0}.track.active{background:#1e293b;border-radius:12px}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0}.big{font-size:20px;border-radius:50%;width:52px;height:52px;padding:0}
input[type=range]{width:100%}.row{display:flex;gap:10px;align-items:center}.time{font-size:12px;color:#94a3b8}
a{color:inherit;text-decoration:none}.empty{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🎵 Мой Музыкальный Плеер</h1><div class="muted">Слушай свои треки прямо в браузере</div></div>
    <button onclick="document.getElementById('files').click()">＋ Добавить музыку</button>
    <input id="files" type="file" accept="audio/*" multiple hidden>
  </div>

  <div class="card">
    <input id="search" class="search" placeholder="🔎 Поиск по названию...">
  </div>

  <div class="card drop" id="drop">Перетащи сюда MP3, WAV, OGG или другие аудиофайлы</div>

  <div class="card">
    <b>Плейлист (<span id="count">0</span>)</b>
    <div id="list" class="empty">Добавь первый трек</div>
  </div>

  <div class="card">
    <div class="muted">Сейчас играет</div>
    <div id="current" style="font-size:18px;font-weight:bold;margin-top:5px">—</div>
    <div class="controls">
      <button class="secondary" onclick="prev()">⏮</button>
      <button class="big" id="play" onclick="toggle()">▶</button>
      <button class="secondary" onclick="next()">⏭</button>
    </div>
    <div class="row"><span class="time" id="curtime">00:00</span><input id="progress" type="range" min="0" max="0" value="0" step="0.1"><span class="time" id="duration">00:00</span></div>
    <div class="row" style="margin-top:15px"><span>🔊</span><input id="volume" type="range" min="0" max="1" value="0.9" step="0.01"></div>
  </div>
</div>

<audio id="audio"></audio>
<script>
const audio=document.getElementById('audio'), files=document.getElementById('files'), list=document.getElementById('list');
let tracks=[], index=-1, playing=false;
const fmt=s=>{s=Number(s)||0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};

function addFiles(fs){[...fs].filter(f=>f.type.startsWith('audio/')).forEach(f=>tracks.push({name:f.name,url:URL.createObjectURL(f),file:f}));render();if(index<0&&tracks.length){index=0;load(false)}}
files.onchange=e=>addFiles(e.target.files);

const drop=document.getElementById('drop');
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};

function visible(){const q=document.getElementById('search').value.toLowerCase();return tracks.map((t,i)=>({t,i})).filter(x=>x.t.name.toLowerCase().includes(q))}
document.getElementById('search').oninput=render;

function render(){
 const v=visible(); document.getElementById('count').textContent=v.length;
 if(!v.length){list.className='empty';list.textContent='Нет треков';return}
 list.className='';
 list.innerHTML=v.map(x=>`<div class="track ${x.i===index?'active':''}" onclick="choose(${x.i})"><div>🎵</div><div class="name">${esc(x.t.name)}</div><a href="${x.t.url}" download="${esc(x.t.name)}" onclick="event.stopPropagation()"><button class="secondary">⬇</button></a></div>`).join('');
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(auto=true){if(index<0||!tracks[index])return;audio.src=tracks[index].url;document.getElementById('current').textContent=tracks[index].name;render();if(auto)audio.play().then(()=>{playing=true;updatePlay()})}
function choose(i){index=i;load(true)}
function toggle(){if(index<0){if(tracks.length){index=0;load(true)}return}if(audio.paused){audio.play();playing=true}else{audio.pause();playing=false}updatePlay()}
function updatePlay(){document.getElementById('play').textContent=audio.paused?'▶':'⏸'}
function next(){if(!tracks.length)return;index=(index+1)%tracks.length;load(true)}
function prev(){if(!tracks.length)return;index=(index-1+tracks.length)%tracks.length;load(true)}
audio.ontimeupdate=()=>{progress.max=audio.duration||0;progress.value=audio.currentTime;curtime.textContent=fmt(audio.currentTime);duration.textContent=fmt(audio.duration)}
audio.onplay=()=>{playing=true;updatePlay()}
audio.onpause=()=>{playing=false;updatePlay()}
audio.onended=next;
progress.oninput=()=>audio.currentTime=progress.value;
volume.oninput=()=>audio.volume=volume.value;
audio.volume=.9;
</script>
</body>
</html>
